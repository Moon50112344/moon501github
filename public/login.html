<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Login | GitShowcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 font-['Inter'] antialiased min-h-screen flex items-center justify-center">
  <div class="max-w-7xl mx-auto px-4 w-full flex-center">
    <div class="w-full max-w-md flex flex-col items-center">
      <a href="/" class="mb-8 text-slate-500 hover:text-white flex items-center gap-2 transition-colors font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Gallery
      </a>
      <div class="w-full bg-slate-900 border border-slate-800 p-8 md:p-10 rounded-3xl glass shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
        <div class="text-center mb-10">
          <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-900/40">
            <i data-lucide="lock" class="text-white w-6 h-6"></i>
          </div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Identity Verification</h1>
          <p class="text-slate-400 mt-3 text-sm leading-relaxed">Authorized access required to manage the restricted project dashboard.</p>
        </div>
        <form id="login-form" class="space-y-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Secure Passkey</label>
            <div class="relative">
              <input type="password" id="password" required autofocus class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all custom-placeholder" placeholder="••••••••">
              <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-blue-400 transition-colors" aria-label="Toggle password visibility">
                <i data-lucide="eye" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="mt-4 flex flex-col gap-2">
              <p id="error-message" class="text-sm text-red-400 hidden flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                Verification failed.
              </p>
              <div class="flex items-center">
                <p class="custom-placeholder-hint text-[10px] uppercase tracking-widest ml-auto">
                  Hint: happy106725
                </p>
              </div>
            </div>
          </div>
          <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 active:scale-[0.98]">
            Verify Identity
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
      <p class="mt-12 text-slate-600 text-xs font-medium uppercase tracking-widest">&copy; 2024 GitShowcase Security</p>
    </div>
  </div>
  <script src="/login.js" type="module"></script>
</body>
</html>
